*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000}

.g{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid rgba(47,155,255,.35);border-radius:14px;padding:16px;margin-top:12px;color:var(--ink);text-decoration:none;backdrop-filter:blur(4px)}
.g:hover,.g:focus-visible{border-color:var(--blue);box-shadow:0 0 22px var(--glow);outline:none}
.g b{font-size:19px;display:block}
.g span{color:var(--mut);font-size:14px;display:block}
.go{flex:none;background:var(--blue);color:#001224;font-weight:900;border-radius:10px;padding:8px 18px}
footer{text-align:center;color:var(--mut);font-size:13px;margin-top:34px}
