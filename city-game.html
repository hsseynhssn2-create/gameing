<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>المدينة - لعبة عالم مفتوح</title>
<style>
:root{--bg:#1d2a2f;--ink:#f1f5f7;--acc:#f2b632;--red:#e5483d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"],:root:not([data-theme="light"]){--bg:#1d2a2f}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font-weight:700}
.p{background:rgba(10,18,22,.72);padding:6px 12px;border-radius:8px;font-size:15px}
#st{color:var(--acc);letter-spacing:2px}
#msg{position:fixed;top:calc(env(safe-area-inset-top,0px) + 56px);left:0;right:0;text-align:center;pointer-events:none;font-size:16px;font-weight:700;text-shadow:0 2px 4px #000;min-height:24px}
#act{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);right:22px;width:92px;height:92px;border-radius:50%;border:3px solid var(--acc);background:rgba(10,18,22,.75);color:var(--ink);font:700 17px Tahoma,Arial,sans-serif}
#act:active{background:var(--acc);color:#111}
#act:focus-visible{outline:3px solid #fff;outline-offset:3px}
#intro{position:fixed;inset:0;background:rgba(12,20,24,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;line-height:1.8}
#intro h1{margin:0;font-size:34px}
#intro button{font:700 20px Tahoma,Arial,sans-serif;background:var(--acc);border:0;border-radius:10px;padding:12px 36px;color:#111}
#intro button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#intro p{margin:0;max-width:360px;color:#c8d4da}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div class="p" id="mo"></div><div class="p" id="mi"></div><div class="p" id="st"></div></div>
<div id="msg"></div>
<button id="act">ركوب</button>
<div id="intro">
<h1>المدينة</h1>
<p>اتحرك في مدينة مفتوحة. اركب أي عربية، وصّل الطلبات، واحذر من الشرطة.</p>
<p>الموبايل: اسحب بصباعك على الشاشة للحركة. الزر الأصفر للركوب والنزول.<br>الكمبيوتر: الأسهم أو WASD للحركة، وE للركوب والنزول.</p>
<button id="go">ابدأ اللعب</button>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const G=360,R=110,SW=24,N=10,WS=N*G;
let W,H,sc,dpr;
function rs(){dpr=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;sc=Math.max(.75,Math.min(W,H)/620)}
addEventListener('resize',rs);rs();
const $=id=>document.getElementById(id);
const dd=v=>{const m=((v%G)+G)%G;return Math.min(m,G-m)};
const inb=(x,y)=>x>8&&y>8&&x<WS-8&&y<WS-8;
const okD=(x,y)=>inb(x,y)&&(dd(x)<R/2||dd(y)<R/2);
const okW=(x,y)=>inb(x,y)&&(dd(x)<R/2+SW||dd(y)<R/2+SW);
const hsh=(a,b)=>{const x=Math.sin(a*127.1+b*311.7)*43758.5453;return x-Math.floor(x)};
const rnd=(a,b)=>a+Math.random()*(b-a);
const angD=(a,b)=>{let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return -d};
function blocked(x,y,a,hw,hh,dr){const c=Math.cos(a),s=Math.sin(a);
 for(const [u,v] of [[hw,hh],[hw,-hh],[-hw,hh],[-hw,-hh]]){const px=x+u*c-v*s,py=y+u*s+v*c;if(!(dr?okD(px,py):okW(px,py)))return true}return false}
function mv(o,dx,dy,hw,hh,dr){let h=false;
 if(!blocked(o.x+dx,o.y,o.a,hw,hh,dr))o.x+=dx;else h=true;
 if(!blocked(o.x,o.y+dy,o.a,hw,hh,dr))o.y+=dy;else h=true;return h}

const COLS=['#c9503f','#3f78c9','#d9b43a','#4aa37a','#8a5fc4','#e8e8e8','#e08a3a','#4b5560'];
let P,cars,pol,peds,tgt,money,msgT=0,keys={},stick={x:0,y:0},run=false;
function say(t){$('msg').textContent=t;msgT=3}
function newTarget(){let x,y;do{x=Math.floor(rnd(1,N))*G;y=Math.floor(rnd(1,N))*G}while(Math.hypot(x-P.x,y-P.y)<700);tgt={x,y}}
function mkCar(x,y,a,ai){return{x,y,a,v:0,col:COLS[Math.floor(Math.random()*COLS.length)],ai,cool:0,hold:0}}
function spawnAI(){const i=Math.floor(rnd(1,N)),j=Math.floor(rnd(1,N));
 const a=[0,Math.PI/2,Math.PI,-Math.PI/2][Math.floor(Math.random()*4)];
 let x=i*G,y=j*G+rnd(-G*.4,G*.4);const rx=-Math.sin(a),ry=Math.cos(a);
 if(Math.cos(a)!==0&&Math.abs(Math.cos(a))>.5){x=rnd(60,WS-60);y=j*G+ry*20}else{y=rnd(60,WS-60);x=i*G+rx*20}
 return mkCar(x,y,a,true)}
function init(){
 P={x:5*G+60,y:5*G+R/2+12,a:0,car:null,heat:0,ht:0,cc:0,caught:0,far:0};
 cars=[];for(let i=0;i<30;i++)cars.push(spawnAI());
 cars.push(mkCar(5*G+120,5*G+20,0,false));
 pol=[];peds=[];for(let i=0;i<45;i++)peds.push(spawnPed());
 money=0;newTarget();say('اركب عربية وابدأ توصيل الطلبات')}
function spawnPed(){const i=Math.floor(rnd(0,N+1)),s=Math.random()<.5?1:-1,o=s*(R/2+12);
 const p=Math.random()<.5?{x:i*G+o,y:rnd(40,WS-40)}:{x:rnd(40,WS-40),y:i*G+o};
 p.a=rnd(0,6.28);p.t=rnd(1,4);p.h=0;p.col=COLS[Math.floor(Math.random()*COLS.length)];return p}
function crime(n){if(P.cc>0)return;P.cc=3;P.ht=0;if(P.heat<3)P.heat=Math.min(3,P.heat+n);say('الشرطة بتطاردك!')}
function spawnPol(){let x,y,k=0;do{x=Math.floor(rnd(0,N+1))*G;y=Math.floor(rnd(0,N+1))*G;k++}while((Math.hypot(x-P.x,y-P.y)<450||Math.hypot(x-P.x,y-P.y)>1000)&&k<40);
 const c=mkCar(x,y,0,false);c.col='#f4f6f8';c.p=1;pol.push(c)}
function toggle(){if(!run)return;
 if(P.car){const c=P.car;c.v=0;const rx=-Math.sin(c.a),ry=Math.cos(c.a);let ok=false;
  for(const s of [1,-1,2,-2]){const x=c.x+rx*34*s,y=c.y+ry*34*s;if(okW(x,y)){P.x=x;P.y=y;ok=true;break}}
  if(!ok){P.x=c.x;P.y=c.y}P.car=null}
 else{let b=null,bd=60;for(const c of cars){const d=Math.hypot(c.x-P.x,c.y-P.y);if(d<bd){bd=d;b=c}}
  if(b){P.car=b;if(b.ai){b.ai=false;crime(1)}}else say('مفيش عربية قريبة')}}
$('act').onclick=toggle;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='e')toggle()});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
let sid=null,so={x:0,y:0};
cv.addEventListener('pointerdown',e=>{if(sid===null){sid=e.pointerId;so={x:e.clientX,y:e.clientY};stick={x:0,y:0}}});
cv.addEventListener('pointermove',e=>{if(e.pointerId===sid){let dx=(e.clientX-so.x)/55,dy=(e.clientY-so.y)/55;const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}stick={x:dx,y:dy}}});
const up=e=>{if(e.pointerId===sid){sid=null;stick={x:0,y:0}}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
function input(){let x=stick.x,y=stick.y;
 if(keys['arrowleft']||keys['a'])x-=1;if(keys['arrowright']||keys['d'])x+=1;
 if(keys['arrowup']||keys['w'])y-=1;if(keys['arrowdown']||keys['s'])y+=1;
 const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}return{x,y,m:Math.min(1,m)}}

function update(dt){
 const inp=input();
 if(P.cc>0)P.cc-=dt;
 if(P.car){const c=P.car;
  if(inp.m>.15){const ta=Math.atan2(inp.y,inp.x),da=angD(c.a,ta);
   const sp=Math.min(1,Math.abs(c.v)/90+.35),turn=Math.sign(da)*Math.min(Math.abs(da),3.4*sp*dt),na=c.a+turn;
   if(!blocked(c.x,c.y,na,22,11,true))c.a=na;
   if(Math.abs(da)>2.4)c.v*=Math.pow(.02,dt);else c.v+=(inp.m*280-c.v)*Math.min(1,1.4*dt)}
  else c.v*=Math.pow(.15,dt);
  if(mv(c,Math.cos(c.a)*c.v*dt,Math.sin(c.a)*c.v*dt,22,11,true))c.v*=.5;
  P.x=c.x;P.y=c.y;P.a=c.a;
  for(const o of cars){if(o===c)continue;const d=Math.hypot(o.x-c.x,o.y-c.y);
   if(d<38){const nx=(c.x-o.x)/(d||1),ny=(c.y-o.y)/(d||1);if(Math.abs(c.v)>110&&o.ai)crime(1);
    if(okD(c.x+nx*4,c.y+ny*4)){c.x+=nx*4;c.y+=ny*4}c.v*=.6;o.hold=.8}}
 }else{
  if(inp.m>.1){P.a=Math.atan2(inp.y,inp.x);mv(P,inp.x*150*dt,inp.y*150*dt,7,7,false)}}
 for(const c of cars){if(!c.ai)continue;
  let go=1;for(const o of cars){if(o===c)continue;const dx=o.x-c.x,dy=o.y-c.y,f=dx*Math.cos(c.a)+dy*Math.sin(c.a),s=-dx*Math.sin(c.a)+dy*Math.cos(c.a);if(f>0&&f<80&&Math.abs(s)<26)go=0}
  if(c.hold>0){c.hold-=dt;go=0}
  c.v+=((go?95:0)-c.v)*Math.min(1,3*dt);
  mv(c,Math.cos(c.a)*c.v*dt,Math.sin(c.a)*c.v*dt,22,11,true);
  c.cool-=dt;const ix=Math.round(c.x/G)*G,iy=Math.round(c.y/G)*G;
  if(c.cool<=0&&Math.hypot(c.x-ix,c.y-iy)<34){
   const o=[0,Math.PI/2,Math.PI,-Math.PI/2].filter(a=>Math.abs(angD(a,c.a))<3&&ix+Math.cos(a)*G>=0&&ix+Math.cos(a)*G<=WS&&iy+Math.sin(a)*G>=0&&iy+Math.sin(a)*G<=WS);
   o.push(c.a,c.a);const a=o[Math.floor(Math.random()*o.length)];c.a=a;
   if(Math.abs(Math.cos(a))>.5)c.y=iy+Math.cos(a)*20;else c.x=ix-Math.sin(a)*20;c.cool=2}}
 // police
 if(P.heat>0){P.ht+=dt;if(P.ht>25){P.heat=0;pol=[];say('الشرطة سابتك')}}
 while(pol.length<P.heat)spawnPol();
 let near=false,close=false;
 for(const c of pol){const dx=P.x-c.x,dy=P.y-c.y,d=Math.hypot(dx,dy);c.a=Math.atan2(dy,dx);
  const sp=170+P.heat*30;if(d>34)mv(c,dx/d*sp*dt,dy/d*sp*dt,18,10,false);
  if(d<600)near=true;if(d<42)close=true}
 if(close)P.caught+=dt;else P.caught=Math.max(0,P.caught-dt);
 if(P.heat>0&&!near){P.far+=dt;if(P.far>6){P.heat=0;pol=[];P.far=0;say('هربت من الشرطة!')}}else P.far=0;
 if(P.caught>2){money=Math.max(0,money-200);P.heat=0;pol=[];P.caught=0;
  if(P.car){P.car.v=0;P.car=null}P.x=5*G+60;P.y=5*G+R/2+12;say('اتقبض عليك! خسرت 200')}
 // pedestrians
 for(const p of peds){if(p.h>0){p.h-=dt;if(p.h<=0){Object.assign(p,spawnPed())}continue}
  p.t-=dt;if(p.t<=0){p.a+=rnd(-1.2,1.2);p.t=rnd(1,4)}
  let sp=40;const dx=p.x-P.x,dy=p.y-P.y,d=Math.hypot(dx,dy);
  if(P.car&&d<110&&Math.abs(P.car.v)>60){p.a=Math.atan2(dy,dx);sp=130}
  if(P.car&&d<26&&Math.abs(P.car.v)>100){p.h=3;crime(1);say('ممنوع تصدم المشاة!')}
  if(mv(p,Math.cos(p.a)*sp*dt,Math.sin(p.a)*sp*dt,6,6,false))p.a+=Math.PI}
 // mission
 if(Math.hypot(P.x-tgt.x,P.y-tgt.y)<70){const r=300+Math.round(Math.hypot(tgt.x-5*G,tgt.y-5*G)*.15);money+=r;say('تم التوصيل! +'+r);newTarget()}
 if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').textContent=''}
}

function rect(x,y,w,h){ctx.fillRect(x,y,w,h)}
function drawCar(c,t){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a);
 ctx.fillStyle='rgba(0,0,0,.25)';rect(-21,-9,46,24);
 ctx.fillStyle=c.col;rect(-22,-11,44,22);
 ctx.fillStyle='rgba(20,30,40,.8)';rect(-4,-9,12,18);rect(-18,-8,4,16);
 ctx.fillStyle='#fff3b0';rect(19,-10,3,5);rect(19,5,3,5);
 if(c.p){const f=Math.floor(t*6)%2;ctx.fillStyle=f?'#e5483d':'#3f78e0';rect(-3,-9,6,8);ctx.fillStyle=f?'#3f78e0':'#e5483d';rect(-3,1,6,8)}
 ctx.restore()}
function draw(t){
 ctx.setTransform(dpr*sc,0,0,dpr*sc,dpr*W/2,dpr*H/2);
 ctx.translate(-P.x,-P.y);
 const vw=W/sc/2+40,vh=H/sc/2+40,x0=P.x-vw,x1=P.x+vw,y0=P.y-vh,y1=P.y+vh;
 ctx.fillStyle='#3d4a4f';rect(x0,y0,x1-x0,y1-y0);
 ctx.fillStyle='#9aa5a8';
 for(let i=0;i<=N;i++){rect(i*G-R/2-SW,0,R+2*SW,WS);rect(0,i*G-R/2-SW,WS,R+2*SW)}
 ctx.fillStyle='#2e3438';
 for(let i=0;i<=N;i++){rect(i*G-R/2,0,R,WS);rect(0,i*G-R/2,WS,R)}
 ctx.strokeStyle='#d8c34a';ctx.lineWidth=3;ctx.setLineDash([22,18]);
 for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*G,0);ctx.lineTo(i*G,WS);ctx.moveTo(0,i*G);ctx.lineTo(WS,i*G);ctx.stroke()}
 ctx.setLineDash([]);
 for(let i=0;i<N;i++)for(let j=0;j<N;j++){
  const bx=i*G+R/2+SW,by=j*G+R/2+SW,bs=G-R-2*SW,h=bs/2-4;
  if(bx>x1||bx+bs<x0||by>y1||by+bs<y0)continue;
  for(let k=0;k<4;k++){const lx=bx+(k%2)*(h+8),ly=by+Math.floor(k/2)*(h+8),q=hsh(i*4+k,j);
   ctx.fillStyle=`hsl(${200+q*50},12%,${28+q*22}%)`;rect(lx,ly,h,h);
   ctx.fillStyle='rgba(255,255,255,.12)';rect(lx+8,ly+8,h-16,h-16)}}
 // target
 const pulse=1+Math.sin(t*5)*.12;ctx.fillStyle='rgba(242,182,50,.35)';ctx.beginPath();ctx.arc(tgt.x,tgt.y,52*pulse,0,6.3);ctx.fill();
 ctx.fillStyle='#f2b632';ctx.beginPath();ctx.arc(tgt.x,tgt.y,16,0,6.3);ctx.fill();
 for(const p of peds){if(p.h>0)continue;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,6,0,6.3);ctx.fill()}
 for(const c of cars)drawCar(c,t);
 for(const c of pol)drawCar(c,t);
 if(!P.car){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(P.x,P.y,8,0,6.3);ctx.fill();
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(P.x+Math.cos(P.a)*4,P.y+Math.sin(P.a)*4,3.5,0,6.3);ctx.fill()}
 // hud
 $('mo').textContent='الفلوس: '+money.toLocaleString('ar-EG');
 $('st').textContent='★'.repeat(P.heat)+'☆'.repeat(3-P.heat);
 const dx=tgt.x-P.x,dy=tgt.y-P.y,ang=Math.atan2(dy,dx);
 $('mi').innerHTML='<span style="display:inline-block;transform:rotate('+ang+'rad)">➤</span> الطلب: '+Math.round(Math.hypot(dx,dy)/10)+' م';
 $('act').textContent=P.car?'نزول':'ركوب';
}
let last=0;
function loop(ts){const t=ts/1000,dt=Math.min(.05,t-last||0);last=t;if(run)update(dt);if(P)draw(t);requestAnimationFrame(loop)}
init();requestAnimationFrame(loop);
$('go').onclick=()=>{$('intro').style.display='none';run=true};
</script>
</body>
</html>
